<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Printory | Đăng nhập / Đăng ký</title>
    <link rel="stylesheet" href="css/font.css" />
    <link rel="stylesheet" href="css/auth.css" />
    <style>
      /* Thêm style để hiển thị thông báo lỗi nếu cần */
      .error-msg {
        color: red;
        font-size: 13px;
        margin-bottom: 10px;
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        <a href="index.html">PRIN<span>TORY</span></a>
      </div>
    </header>

    <div class="container">
      <div class="auth-box">
        <div class="tabs">
          <div id="loginTab" class="tab active" onclick="switchTab('login')">
            Đăng nhập
          </div>
          <div id="registerTab" class="tab" onclick="switchTab('register')">
            Đăng ký
          </div>
        </div>

        <div id="errorMsg" class="error-msg"></div>

        <form id="loginForm" class="active" onsubmit="handleLogin(event)">
          <label>Email</label>
          <input type="email" id="loginEmail" required />

          <label>Mật khẩu</label>
          <input type="password" id="loginPass" required />

          <div class="sub">
            <p>Quên mật khẩu?</p>
            <button type="button" onclick="switchTab('register')">
              Chưa có tài khoản
            </button>
          </div>
          <button type="submit" class="btn">Đăng nhập</button>
        </form>

        <form id="registerForm" onsubmit="handleRegister(event)">
          <label>Họ tên</label>
          <input type="text" id="regName" required />

          <label>Email</label>
          <input type="email" id="regEmail" required />

          <label>Mật khẩu</label>
          <input type="password" id="regPass" required />

          <label>Nhập lại mật khẩu</label>
          <input type="password" id="regConfirm" required />

          <button type="submit" class="btn">Đăng ký</button>
        </form>
      </div>
    </div>

    <script>
      // Chuyển đổi qua lại giữa Đăng nhập & Đăng ký
      function switchTab(tab) {
        document
          .querySelectorAll(".tab")
          .forEach((t) => t.classList.remove("active"));
        document
          .querySelectorAll("form")
          .forEach((f) => f.classList.remove("active"));
        document.getElementById(tab + "Tab").classList.add("active");
        document.getElementById(tab + "Form").classList.add("active");
        document.getElementById("errorMsg").style.display = "none";
      }

      // XỬ LÝ ĐĂNG KÝ
      function handleRegister(e) {
        e.preventDefault();
        const name = document.getElementById("regName").value;
        const email = document.getElementById("regEmail").value;
        const pass = document.getElementById("regPass").value;
        const confirm = document.getElementById("regConfirm").value;

        if (pass !== confirm) {
          showError("Mật khẩu nhập lại không khớp!");
          return;
        }

        // Lưu thông tin user vào localStorage (Giả lập database)
        const user = { name, email, pass };
        localStorage.setItem(email, JSON.stringify(user));

        alert("Đăng ký thành công! Hãy đăng nhập.");
        switchTab("login");
      }

      // XỬ LÝ ĐĂNG NHẬP
      function handleLogin(e) {
        e.preventDefault();
        const email = document.getElementById("loginEmail").value;
        const pass = document.getElementById("loginPass").value;

        // Lấy thông tin user từ localStorage
        const storedUser = localStorage.getItem(email);

        if (storedUser) {
          const user = JSON.parse(storedUser);
          if (user.pass === pass) {
            // 1. Lưu tên vào đúng Key mà main.js đang đợi (là "username")
            localStorage.setItem("username", user.name);
            localStorage.setItem("isLoggedIn", "true");

            alert("Chào mừng " + user.name + " quay trở lại!");

            // 2. Chuyển hướng trang web LỚN (thoát khỏi iframe) về index.html
            // Dùng top.location.href để đảm bảo nó nhảy ra khỏi cái khung modal
            top.location.href = "index.html";
          } else {
            showError("Mật khẩu không chính xác!");
          }
        } else {
          showError("Tài khoản không tồn tại!");
        }
      }

      function showError(text) {
        const errorEl = document.getElementById("errorMsg");
        errorEl.textContent = text;
        errorEl.style.display = "block";
      }
    </script>
  </body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header Printory</title>
    
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@500;600;800&family=Denk+One&family=Kanit:wght@700&family=UTM+Times&family=Mansalva&display=swap" rel="stylesheet">

    <!-- Font Awesome (Icon) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

header {
    background-color: #053046;
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'Kanit', sans-serif;
}

.logo {
    font-size: 28px;
    font-weight: 800;
    color: white;
    font-family: 'Baloo Thambi 2', sans-serif;
}

.logo span {
    color: #fa8501;
}

.search-box {
    flex: 0.7;
    margin: 0 30px;
    position: relative;
}

.search-box input {
    width: 100%;
    padding: 12px 40px;
    border-radius: 30px;
    border: none;
    outline: none;
}

.search-box i {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: #d9d9d9;
}

        /* ===== NAV ===== */
.nav {
    display: flex;
    align-items: center;
    gap: 18px;
    color: #ffffff;
    font-family: 'Baloo Thambi 2', sans-serif;
}

.nav a {
    color: #ffffff;
    text-decoration: none;
    font-weight: bold; 
}

.cart-icon,
.user-icon {
    font-size: 24px; 
    color: #fa8501;  
 
}

.cart-text {
    font-family: 'Baloo Thambi 2', sans-serif;
    font-weight: 800; 
    color: white; 
    margin-left: 6px;
}


.user {
    display: flex;
    align-items: center;
    gap: 6px; 
}


.user-text {
    font-family: 'Baloo Thambi 2', sans-serif;
    font-weight: 800; 
    color: white;
}


.btn-register {
    background-color: #fa8501;
    border: none;
    padding: 10px 18px;
    border-radius: 25px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
}

.btn-register .btn-text {
    font-family: 'Baloo Thambi 2', sans-serif;
    font-weight: 800;
    color: white;
}
    </style>
</head>
<body>
    <header>
        <div class="logo">PRIN<span>TORY</span></div>

        <div class="search-box">
            <i class="fa fa-search"></i>
            <input type="text" placeholder="Tìm kiếm...">
        </div>

        <nav class="nav">
            <a href="#">Printory Blog</a>
            <a href="#">Hỗ trợ</a>
            <a href="#" class="cart">
            <i class="fa fa-shopping-cart cart-icon"></i>
        <span class="cart-text">Giỏ hàng</span>
        </a>

            <a href="#" class="user">
            <i class="fa fa-user user-icon"></i>
        <span class="user-text">Đăng ký</span>
        </a>
            
        </nav>
    </header>
</body>
</html>
